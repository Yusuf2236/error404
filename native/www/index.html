<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <title>VIP UZBE</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: radial-gradient(120% 100% at 50% 30%, #1a1a24 0%, #08080c 100%);
        color: #e8e0c8;
        font-family: Georgia, "Times New Roman", serif;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 20px; }
      h1 { color: #f5d061; letter-spacing: 4px; margin: 1.2rem 0 0.3rem; font-size: 1.4rem; }
      p { opacity: 0.7; font-size: 0.85rem; }
      .dot { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.3 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <!-- Shown only while the native shell connects to the live VIP UZBE app. -->
    <img src="icon.png" alt="VIP UZBE" onerror="this.style.display='none'" />
    <h1>VIP UZBE</h1>
    <p>Loading your experience<span class="dot">…</span></p>
  </body>
</html>
